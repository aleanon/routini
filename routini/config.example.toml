# TOML equivalent of config.json. routini reads either format: pass --config <path>, set
# ROUTINI_CONFIG, or name the file config.toml / config.json in the working directory.
# The format follows the extension (.toml / .json); other extensions are detected from the content.
# Unknown keys are rejected, so typos fail loudly. Validate with: routini --check --config <path>

[server]
prometheus_address = "0.0.0.0:9000"

# Behind a load balancer or CDN: believe the client address it forwards (nginx real_ip).
# Rate/connection limits, allow/deny, hash keys and the access log then see the client, not
# the proxy. The header is read right to left, skipping trusted addresses.
# real_ip = { trusted_proxies = ["10.0.0.0/8", "127.0.0.1"], header = "X-Forwarded-For" }

# Client connection timeouts in seconds (nginx defaults shown). keepalive 0 disables it.
# keepalive_timeout_secs = 75
# client_body_timeout_secs = 60
# send_timeout_secs = 60

# Limits on the connections each proxy listener (plain, TLS) accepts. Over a limit a new
# connection is closed right after accept. Needs a restart to change.
# max_connections: open connections (nginx worker_connections); keep the sum of both listeners
#   below the process's file descriptor limit
# max_pending_handshakes: unfinished TLS handshakes, size it to what the server can finish in
#   handshake_timeout_secs (default 60)
# skip_closed_peers: don't start the handshake of a client that already gave up (Linux)
# listener_limits = { max_connections = 10000, max_pending_handshakes = 1000, handshake_timeout_secs = 10, skip_closed_peers = true }

[proxy]
# A port (bound on all interfaces) or "host:port". Env override: SERVER_ADDRESS
listener = 3500

# TLS termination on a second listener. Paths are relative to this file. Certificates
# (listed or their files) are reloaded on SIGHUP without a restart.
# [proxy.tls]
# listener = 3443
# cert_path = "certs/default.pem"   # served without SNI or when no other certificate matches
# key_path = "certs/default.key"
# enable_h2 = true
# min_version = "1.2"               # or "1.3"
# client_ca_path = "certs/clients.pem"   # require client certificates from this CA (mTLS)
# Handshakes on dedicated threads (pools x threads_per_pool), so a burst of new clients doesn't
# hold up requests in flight. Restart to change.
# handshake_offload = { pools = 1, threads_per_pool = 2 }
# [[proxy.tls.certificates]]        # more certificates, selected by the DNS names they list
# cert_path = "certs/api.pem"
# key_path = "certs/api.key"

[[proxy.router]]
path = "/api/*"
strip_prefix = true
# Virtual host (nginx server_name): "api.example.com", or "*.example.com" for any subdomain
# (an exact name wins, then the longest wildcard). Without it the route is on the default server.
# host = "api.example.com"

# Access control, all optional (nginx allow/deny/auth_basic). Users are "user:<bcrypt hash>"
# as `htpasswd -nB user` prints it (preferred, the password stays out of this file) or
# "user:password".
# Per-client rate limit (nginx limit_req): a sustained rate, plus a burst that may arrive at
# once (default: one second's worth). Over the burst: 429. rate_limit_delay = true holds
# burst requests until their slot instead of passing them at once (nginx without nodelay).
# rate_limit_rps = 10
# rate_limit_burst = 20
# rate_limit_delay = false

# Failover to another backend (nginx proxy_next_upstream). Connect errors are always safe
# to retry; timeouts and statuses only for methods that can be repeated (not POST, PATCH,
# LOCK unless retry_non_idempotent), and never once the client got part of the response.
# [proxy.router.retry]
# max_retries = 1
# retry_on_connect_error = true
# retry_on_timeout = true
# retry_on_status = [502, 503, 504]
# retry_non_idempotent = false

# HTTPS to the backends (nginx proxy_pass https:// and proxy_ssl_*). CA and client
# certificate files are re-read on reload when they change.
# [proxy.router.upstream_tls]
# enabled = true
# sni = "api.internal"
# verify = true                        # certificate and hostname
# ca_path = "certs/internal-ca.pem"    # instead of the system's CAs
# client_cert_path = "certs/routini.pem"   # present a client certificate (mTLS)
# client_key_path = "certs/routini.key"
# h2 = false

# [proxy.router.access]
# allow = ["10.0.0.0/8"]
# deny = ["10.1.2.3"]
# basic_auth_realm = "ops"
# basic_auth = ["alice:$2y$05$..."]

[proxy.router.load_balancer]
strategy = "RoundRobin"
max_iterations = 100
health_check_interval_secs = 1
# What FNVHash/Consistent hash, so a client keeps its backend (nginx ip_hash / hash):
# "client_ip" (default), "uri", "path", "header:<name>" or "cookie:<name>". A missing
# header/cookie falls back to the client address. With a hash strategy as `strategy` the
# adaptive engine never switches away from it.
# hash_key = "client_ip"
# Upstream addresses may be "hostname:port"; each address a name resolves to becomes a
# backend. Names are resolved again every dns_refresh_secs (0 = once); a failed lookup keeps
# the previous addresses.
# dns_refresh_secs = 30

# How backends are probed while health_check_interval_secs > 0. Default: a TCP connect.
# HTTP probes use the route's upstream_tls (scheme, SNI, verification).
# [proxy.router.load_balancer.health_check]
# type = "http"
# path = "/health"
# expected_status = [200]   # default: any 2xx or 3xx
# timeout_ms = 1000
# passes = 1                # successes in a row to bring a backend back
# fails = 1                 # failures in a row to take it out

# Adaptive tuning, all optional (defaults shown in comments)
[proxy.router.load_balancer.adaptive_lb_opt]
# latency_smoothing_factor = 0.5
# connections_divergence_ratio = 1.2
# latency_divergence_ratio = 2.0
# evaluate_strategy_frequency_secs = 5
# min_nr_of_connections = 1000
# hysteresis_exit_factor = 0.75

[[proxy.router.load_balancer.upstreams]]
address = "127.0.0.1:4001"
weight = 1

